name: CI

# Fork-safe by construction: no secrets are read anywhere in this workflow —
# every backing store is an ephemeral service container with throwaway
# credentials. The token is pinned to read-only so a fork PR cannot use it.
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  # Lets any ref be run on demand — without it, the only way to test a commit
  # whose run never started is to push another commit on top of it, which tests
  # a different tree than the one that went untested.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Local development, CI and production all pin the same exact patch.
  NODE_VERSION: '24.18.0'

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # A clean install from the committed lockfile. If the lockfile is stale,
      # this fails rather than quietly resolving something else.
      - run: pnpm install --frozen-lockfile

      # Runs first: it is the fastest check and catches the one thing this
      # repository must never contain — a runtime import of the legacy app.
      - name: Architectural boundaries
        run: pnpm run boundaries

      - name: Format check
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: OpenAPI lint
        run: pnpm run contracts:lint

      # Proves the committed generated client still matches openapi.yaml.
      - name: Generated client is in sync
        run: pnpm run contracts:check

      - name: Typecheck
        run: pnpm run typecheck

      # Acceptance criterion 5 (Milestone 7): the generated client compiles in an
      # apps/web-like consumer that sees only the published package. `typecheck`
      # above builds the contracts `dist` the smoke project resolves against.
      - name: Frontend client smoke build
        run: pnpm run contracts:smoke

  test:
    name: Unit and contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run test

      # The tracker runs on customers' sites, so its size is their cost, paid on
      # every page load. The budget and its justification are in ADR-0008.
      - name: Tracker size budget
        run: pnpm run tracker:build

  web:
    name: Web lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # apps/web keeps its own eslint-config-next setup; the root lint job
      # deliberately ignores it (D-218 — separate toolchains, one repo).
      - name: Lint web
        run: pnpm --filter web lint

      # `next build` also typechecks the app, so this is the web equivalent of
      # the backend's typecheck + build steps.
      - name: Build web
        run: pnpm --filter web build

  integration:
    name: Integration skeleton
    runs-on: ubuntu-latest

    # The Milestone 5 collector suite needs a real Valkey: what it proves is
    # that the enqueue EVAL is genuinely uninterruptible and that a conflict
    # leaves nothing enqueued, and a local double would only prove our
    # TypeScript (ADR-0004, ADR-0009). Configured the way D-205 requires the
    # queue instance to run, so CI exercises the production settings:
    # `noeviction` (an evicted key here is a lost event) and AOF.
    services:
      valkey:
        image: valkey/valkey:8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      # The Milestone 6 crash matrix needs all three stores at once. Its
      # subject is what happens *between* them — a ClickHouse insert token
      # reaching a materialized view, a Postgres unique constraint under a real
      # transaction, and a consumer group's pending list — so a double for any
      # one of them would leave the suite proving our TypeScript.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: openanalytics
          POSTGRES_PASSWORD: openanalytics
          POSTGRES_DB: openanalytics_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U openanalytics -d openanalytics_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      # No container health check, for the reason the migrations job records:
      # the probe runs inside the image and busybox wget fails for reasons that
      # have nothing to do with ClickHouse being ready. Waited for from the
      # runner instead.
      clickhouse:
        image: clickhouse/clickhouse-server:26.3-alpine
        env:
          CLICKHOUSE_USER: openanalytics
          CLICKHOUSE_PASSWORD: openanalytics
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: '1'
        ports: ['8123:8123']

    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Integration tests spawn the real build output, so a broken exports map or
      # a bootstrap that never binds a port is caught here rather than on deploy.
      - name: Build
        run: pnpm run build

      # Started as a step rather than as a `services:` container: the image takes
      # its data directory as a command argument, and service containers can only
      # supply an image plus options, never arguments.
      #
      # RustFS, not MinIO. MinIO stopped publishing images: Docker Hub first
      # (2026-09-16), then Quay (2026-09-25, `unauthorized` to an anonymous pull),
      # and its binary archive answers 410. RustFS 1.0.0 passes the whole
      # object-storage suite; SeaweedFS and Garage failed the signed browser
      # upload and LocalStack served a private object without a signature.
      #
      # Pinned to a release rather than `latest` for the same reason Node and
      # ClickHouse are pinned — a floating tag makes CI results depend on when
      # they ran (D-203).
      - name: Start RustFS
        run: |
          docker run -d --name rustfs -p 9000:9000             -e RUSTFS_ACCESS_KEY=rustfsadmin             -e RUSTFS_SECRET_KEY=rustfsadmin             rustfs/rustfs:1.0.0 /data

      - name: Wait for RustFS
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:9000/health > /dev/null; then
              echo "rustfs ready after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 2
          done
          echo "rustfs did not become live within 120s; last attempt:"
          curl -vsS http://localhost:9000/health || true
          docker logs rustfs || true
          exit 1

      # `noeviction` is D-205's requirement for the queue instance and the one
      # setting ADR-0004 found inverted in production. Applied at runtime rather
      # than baked in, because a service container takes no command arguments.
      - name: Configure Valkey the way D-205 requires
        run: |
          container=$(docker ps -qf ancestor=valkey/valkey:8-alpine)
          docker exec "$container" valkey-cli config set maxmemory-policy noeviction
          docker exec "$container" valkey-cli config set appendonly yes

      - name: Wait for ClickHouse
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:8123/ping > /dev/null; then
              echo "clickhouse ready after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 2
          done
          echo "clickhouse did not answer /ping within 120s; last attempt:"
          curl -vsS http://localhost:8123/ping || true
          exit 1

      - name: Integration tests
        # RustFS stands in for the S3-compatible provider (Hetzner Object Storage
        # in production). The suites needing Fly infrastructure skip themselves;
        # the object-storage and Valkey ones run for real.
        #
        # `redis://` rather than `rediss://`: the connection factory requires TLS
        # and AUTH for the collector hop because it crosses the public internet
        # (D-206), and a loopback service container is not that hop. The M1 live
        # suite is what exercises the TLS+AUTH path, against the deployed
        # instance.
        env:
          TEST_S3_ENDPOINT: http://localhost:9000
          TEST_S3_ACCESS_KEY: rustfsadmin
          TEST_S3_SECRET_KEY: rustfsadmin
          TEST_VALKEY_URL: redis://localhost:6379
          TEST_POSTGRES_URL: postgres://openanalytics:openanalytics@localhost:5432/openanalytics_test
          TEST_CLICKHOUSE_URL: http://localhost:8123
          TEST_CLICKHOUSE_USER: openanalytics
          TEST_CLICKHOUSE_PASSWORD: openanalytics
        run: pnpm run test:integration

  migrations:
    name: Empty-database migrations
    runs-on: ubuntu-latest

    # Docs snapshot 02 §15: both stores must be buildable from empty in CI. This
    # is the check the legacy migration history could not pass (docs snapshot
    # 01 §3.6).
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: openanalytics
          POSTGRES_PASSWORD: openanalytics
          POSTGRES_DB: openanalytics_test
        ports: ['5432:5432']
        # `-d` is explicit: pg_isready defaults the database name to the user
        # name, so without it the probe repeatedly asks for a database that was
        # never created and fills the log with misleading FATAL lines.
        options: >-
          --health-cmd "pg_isready -U openanalytics -d openanalytics_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      # Deliberately no container health check. A `--health-cmd` runs *inside*
      # the image, so it depends on which tools that image happens to ship;
      # busybox wget in the alpine variant does not handle `--spider` the way
      # GNU wget does, and the probe fails for a reason that has nothing to do
      # with ClickHouse being ready. Readiness is waited for from the runner
      # instead, where the toolchain is known and a failure is legible.
      clickhouse:
        image: clickhouse/clickhouse-server:26.3-alpine
        env:
          CLICKHOUSE_USER: openanalytics
          CLICKHOUSE_PASSWORD: openanalytics
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: '1'
        ports: ['8123:8123']

    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Wait for ClickHouse
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:8123/ping > /dev/null; then
              echo "clickhouse ready after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 2
          done
          echo "clickhouse did not answer /ping within 120s; last attempt:"
          # Unsuppressed so the actual transport error reaches the log rather
          # than the job failing with no explanation.
          curl -vsS http://localhost:8123/ping || true
          exit 1

      # The migrator runs from `dist`, so the assertion below needs a build. The
      # migration tests themselves run from source.
      - name: Build
        run: pnpm run build

      # This repository is the product without the hosted service's commercial
      # half, and that claim is checked against a database rather than against a
      # file list: `pnpm run migrate:postgres` builds the schema, and the script
      # asserts that the product tables are there and that none of the billing,
      # trial or metering-window tables are.
      - name: Product schema has no commercial tables
        env:
          TEST_POSTGRES_URL: postgres://openanalytics:openanalytics@localhost:5432/openanalytics_test
        run: pnpm run schema:product

      - name: Migration tests against empty databases
        env:
          TEST_POSTGRES_URL: postgres://openanalytics:openanalytics@localhost:5432/openanalytics_test
          TEST_CLICKHOUSE_URL: http://localhost:8123
          TEST_CLICKHOUSE_USER: openanalytics
          TEST_CLICKHOUSE_PASSWORD: openanalytics
        run: pnpm run test:migration

  # The rollback path, run rather than reasoned about.
  #
  # There are no down migrations here, by decision, so going back a version is a
  # restore of the snapshot the upgrade took. That makes `snapshot.sh` the only
  # thing standing between an operator and an unrecoverable upgrade — and it is
  # shell that stops databases, empties volumes and refills them from a tarball.
  # Every one of those steps has a plausible-looking wrong version: an archive
  # that loses file ownership, an extract that leaves the old contents in place, a
  # volume name resolved by a guess that was right on the author's machine.
  #
  # So this job writes a row into each store, snapshots, destroys the row,
  # restores, and reads the row back. It uses the real compose file, the real
  # generator and the real scripts. No application image is built: the two stores
  # and the helper image are all that is needed to prove the mechanism, and
  # building ten images to insert one row would put this job out of reach of
  # every pull request.
  selfhost:
    name: Snapshot and restore
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/selfhost
    steps:
      - uses: actions/checkout@v5

      # The generator reads the image tag off the checkout, and the branch that
      # matters most is the one CI cannot reach by standing still: a release
      # install. So put HEAD on a tag, run it, and read `.env` back. Getting this
      # wrong is silent until somebody pastes the quickstart — their
      # `docker compose pull` then hunts for `openanalytics/migrate:local` on
      # Docker Hub, which is how it was wrong before.
      #
      # Everything this writes is deleted again, so the real run below is the
      # one whose output the rest of the job uses.
      - name: The registry, when HEAD is standing on a release tag
        run: |
          set -euo pipefail
          git tag v9.9.9-ci-check
          ./generate-secrets.sh --domain selfhost.test --email ci@selfhost.test
          grep -qx 'OA_IMAGE_REPO=ghcr.io/openlabs-so/openanalytics' .env
          grep -qx 'OA_IMAGE_TAG=v9.9.9-ci-check' .env
          docker compose config --images | grep -qx 'ghcr.io/openlabs-so/openanalytics/api:v9.9.9-ci-check'
          rm -f .env docker-compose.override.yml env/*.env
          git tag -d v9.9.9-ci-check

      # The generator's own happy path, incidentally: twelve env files, the four
      # names, and the three key pairs, from one run. And with the tag gone, the
      # other half of the same decision — a checkout that is not a release
      # builds here, because no registry serves images for an arbitrary commit.
      - name: Generate a configuration
        run: |
          set -euo pipefail
          ./generate-secrets.sh --domain selfhost.test --email ci@selfhost.test
          grep -qx 'OA_IMAGE_REPO=openanalytics' .env
          grep -qx 'OA_IMAGE_TAG=local' .env

      # Not the point of this job, but free here and it is the assertion that
      # would otherwise wait until somebody ran a release install: with the
      # registry variables set, every one of our images resolves to a GHCR path.
      - name: The compose file resolves to the published images
        env:
          OA_IMAGE_REPO: ghcr.io/openlabs-so/openanalytics
          OA_IMAGE_TAG: v9.9.9-check
        run: |
          set -euo pipefail
          images="$(docker compose config --images | grep '^ghcr.io/openlabs-so/openanalytics/' | sort -u)"
          echo "$images"
          count="$(echo "$images" | wc -l)"
          # Ten since v0.3.0: `clickhouse` and `valkey` became ours when the
          # files they cannot start without stopped being bind mounts. Kept in
          # step by `tests/unit/selfhost-release-wiring.test.ts`, which compares
          # the compose file against the release matrix; this line is the third
          # copy of the number and the only one CI can check against a real
          # `docker compose config`.
          [ "$count" -eq 10 ] || { echo "::error::expected 10 published images, resolved $count"; exit 1; }
          echo "$images" | grep -qx 'ghcr.io/openlabs-so/openanalytics/api:v9.9.9-check'
          echo "$images" | grep -qx 'ghcr.io/openlabs-so/openanalytics/valkey:v9.9.9-check'

      - name: Start the two stores
        run: |
          set -euo pipefail
          docker compose up -d postgres clickhouse
          for attempt in $(seq 1 60); do
            pg="$(docker inspect -f '{{.State.Health.Status}}' oa-postgres)"
            ch="$(docker inspect -f '{{.State.Health.Status}}' oa-clickhouse)"
            echo "postgres=$pg clickhouse=$ch"
            [ "$pg" = healthy ] && [ "$ch" = healthy ] && exit 0
            sleep 3
          done
          docker compose logs postgres clickhouse
          exit 1

      - name: Write a row into each store
        run: |
          set -euo pipefail
          docker compose exec -T postgres \
            psql -v ON_ERROR_STOP=1 -U openanalytics -d openanalytics \
            -c "CREATE TABLE snapshot_marker (note text); INSERT INTO snapshot_marker VALUES ('survives a restore');"
          docker compose exec -T clickhouse clickhouse-client --query \
            "CREATE TABLE default.snapshot_marker (note String) ENGINE = MergeTree ORDER BY note"
          docker compose exec -T clickhouse clickhouse-client --query \
            "INSERT INTO default.snapshot_marker VALUES ('survives a restore')"

      # --no-start, then start the two by hand: `snapshot.sh` would otherwise
      # bring the whole stack up, which here means building ten images.
      - name: Take a snapshot
        run: |
          set -euo pipefail
          ./snapshot.sh create --label ci --no-start
          ./snapshot.sh list
          snapshot="$(ls -d backups/*-ci | tail -1)"
          echo "snapshot=$snapshot" >> "$GITHUB_ENV"
          # A snapshot that does not carry the configuration cannot be restored
          # onto a fresh host, and the manifest is what rollback.sh reads.
          test -s "$snapshot/pg-data.tar.gz"
          test -s "$snapshot/ch-data.tar.gz"
          test -s "$snapshot/manifest"
          test -s "$snapshot/env/api.env"
          test -s "$snapshot/docker-compose.override.yml"
          grep -qx 'oa_snapshot_version=1' "$snapshot/manifest"
          grep -q '^pg_volume=openanalytics_pg-data$' "$snapshot/manifest"
          grep -qx 'postgres=volume' "$snapshot/manifest"
          grep -q '^ch_volume=openanalytics_ch-data$' "$snapshot/manifest"
          echo "--- manifest"; cat "$snapshot/manifest"

      - name: Destroy both rows
        run: |
          set -euo pipefail
          docker compose up -d postgres clickhouse
          for attempt in $(seq 1 60); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' oa-postgres)" = healthy ] \
              && [ "$(docker inspect -f '{{.State.Health.Status}}' oa-clickhouse)" = healthy ] && break
            sleep 3
          done
          docker compose exec -T postgres psql -v ON_ERROR_STOP=1 -U openanalytics -d openanalytics \
            -c "DROP TABLE snapshot_marker;"
          docker compose exec -T clickhouse clickhouse-client --query "DROP TABLE default.snapshot_marker"
          # Proving the destruction, so that finding the row afterwards means the
          # restore put it back rather than that it was never gone.
          docker compose exec -T postgres psql -tAX -U openanalytics -d openanalytics \
            -c "SELECT count(*) FROM information_schema.tables WHERE table_name = 'snapshot_marker';" | grep -qx 0
          docker compose exec -T clickhouse clickhouse-client --query \
            "SELECT count() FROM system.tables WHERE database = 'default' AND name = 'snapshot_marker'" | grep -qx 0

      - name: Restore
        run: |
          set -euo pipefail
          ./snapshot.sh restore --from "$snapshot" --no-start
          docker compose up -d postgres clickhouse
          for attempt in $(seq 1 60); do
            pg="$(docker inspect -f '{{.State.Health.Status}}' oa-postgres)"
            ch="$(docker inspect -f '{{.State.Health.Status}}' oa-clickhouse)"
            echo "postgres=$pg clickhouse=$ch"
            [ "$pg" = healthy ] && [ "$ch" = healthy ] && exit 0
            sleep 3
          done
          echo "::error::a store did not come back healthy after the restore"
          docker compose logs postgres clickhouse
          exit 1

      # Postgres coming back healthy at all is half the assertion: the data
      # directory has to be owned by the right uid or the server refuses to
      # start, so a restore that lost ownership fails the step above.
      - name: Both rows are back
        run: |
          set -euo pipefail
          docker compose exec -T postgres psql -tAX -U openanalytics -d openanalytics \
            -c "SELECT note FROM snapshot_marker;" | grep -qx 'survives a restore'
          docker compose exec -T clickhouse clickhouse-client --query \
            "SELECT note FROM default.snapshot_marker" | grep -qx 'survives a restore'
          echo "both stores are the way they were before the snapshot"

      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail 100 || true
